<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SirTros-Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111820;color:#fff;font-family:Nunito,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid #7ce39c;outline-offset:3px}
.icon{width:19px;height:19px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#304c5e,#111820 75%)}
.menuBox{width:min(440px,100%);padding:30px;background:#17212cee;border:1px solid #ffffff20;border-radius:20px;box-shadow:0 15px 50px #0008}
.logo{font-size:40px;font-weight:900;letter-spacing:-2px}
.logo span{color:#79df98}
.sub{color:#aab9c6;margin:4px 0 25px}
.menuBtn{width:100%;padding:14px;margin:5px 0;border-radius:12px;background:#293949;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.menuBtn.primary{background:#61c983;color:#102519}
.menuBtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
#settings{display:none;margin-top:15px;line-height:2.5;color:#cbd6df}
#worldSelect{position:fixed;inset:0;display:none;flex-direction:column;padding:clamp(18px,4vw,42px);background:radial-gradient(ellipse at 50% 0,#304c5e,#111820 75%);overflow:auto;z-index:4}
.worldHead{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.worldHead h1{font-size:clamp(25px,5vw,38px);margin:0;font-weight:900}
.worldHead button{background:#293949;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:900}
.worldHead .newWorld{margin-left:auto;background:#61c983;color:#102519}
#worldGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.worldCard{background:#17212cee;border:1px solid #ffffff20;border-radius:17px;overflow:hidden}
.worldPreview{height:130px;background:linear-gradient(#6eacd7 0 55%,#578448 55%);display:block;width:100%}
.worldCardInfo{padding:14px}
.worldCardName{font-size:18px;font-weight:900}
.worldCardDate{font-size:11px;color:#9eafbd;margin-top:2px}
.worldCardActions{display:flex;gap:8px;margin-top:13px}
.worldCardActions button{border-radius:9px;padding:10px;font-weight:900}
.worldStart{flex:1;background:#61c983;color:#102519}
.worldDelete{background:#56333b;color:#ffdce1}
.worldEmpty{color:#aab9c6;border:1px dashed #ffffff35;border-radius:15px;padding:30px;text-align:center}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#111820;font-size:22px;font-weight:900;z-index:5}
#game{position:fixed;inset:0;display:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
#top{position:absolute;top:14px;left:14px;display:flex;gap:8px}
.hudBtn{pointer-events:auto;background:#17212ddd;border:1px solid #ffffff25;border-radius:12px;padding:10px 13px;font-weight:900;display:flex;align-items:center;gap:8px;backdrop-filter:blur(10px)}
#coords{position:absolute;top:17px;right:15px;background:#17212ddd;padding:8px 12px;border-radius:10px;font-size:12px}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;text-shadow:0 2px 5px black}
#hotbar{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
#hearts{position:absolute;bottom:77px;left:50%;transform:translateX(-50%);display:flex;gap:3px;pointer-events:none;filter:drop-shadow(0 2px 3px #000)}
#hearts i{width:21px;height:21px;color:#ff1738;fill:#ff1738;stroke:#7e1828;stroke-width:1.8}
.slot{width:52px;height:52px;border-radius:9px;background:#17212ddd;border:2px solid #ffffff35;position:relative;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.slot.selected{border:3px solid white;background-color:#526779}
.slot .count{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:900;text-shadow:0 2px 4px black}
.slot .num{position:absolute;left:4px;top:1px;font-size:9px;color:#dce7ef;text-shadow:0 2px 3px black}
#inventory{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(490px,95vw);max-height:90vh;overflow:auto;padding:20px;pointer-events:auto;background:#17212cee;border:1px solid #ffffff25;border-radius:18px;box-shadow:0 15px 50px #0009}
.invTitle{font-size:23px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.section{font-size:12px;color:#a9bac8;font-weight:900;text-transform:uppercase;margin:13px 0 7px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.invslot{aspect-ratio:1;min-width:0;border-radius:7px;background:#293947;border:1px solid #ffffff22;background-size:cover;background-position:center;position:relative;cursor:grab}
.invslot.dragover{outline:2px solid #7de69b}
.invslot .count{position:absolute;right:3px;bottom:0;font-size:12px;font-weight:900;text-shadow:0 2px 4px black}
#invHotbar{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
#craftList{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.recipe{background:#2b3c4c;border-radius:9px;padding:10px;text-align:left;font-size:12px}
.recipe:disabled{opacity:.35;cursor:not-allowed}
.recipe:hover:not(:disabled){background:#3a5267}
#mobile{display:none;pointer-events:none}
#joy{position:absolute;left:22px;bottom:95px;width:112px;height:112px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff50;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:33px;top:33px;width:42px;height:42px;border-radius:50%;background:#ffffffb8}
#jump{position:absolute;right:24px;bottom:100px;width:65px;height:65px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;pointer-events:auto;display:grid;place-items:center}
#progress{position:absolute;top:55%;left:50%;transform:translateX(-50%);width:120px;height:5px;background:#ffffff40;border-radius:9px;display:none;overflow:hidden}
#progress div{height:100%;width:0;background:#fff}
@media(max-width:700px){
 .slot{width:37px;height:43px}
 #hotbar{bottom:9px;gap:3px}
 #hearts{bottom:59px;gap:1px}
 #hearts i{width:17px;height:17px}
 #worldSelect{padding:15px}
 #mobile{display:block}
 #top{top:8px;left:8px}
 .hudBtn{padding:9px}
 #inventory{padding:13px}
}
</style>
</head>
<body>

<div id="menu">
 <div class="menuBox">
  <div class="logo">SirTros<span>-Block</span></div>
  <div class="sub">Vlastní svět. Vlastní dobrodružství.</div>
  <button class="menuBtn primary" id="play"><i data-lucide="play"></i> Hrát</button>
  <button class="menuBtn" id="settingsBtn"><i data-lucide="settings"></i> Nastavení</button>
  <div id="settings">
   Citlivost myši <input id="sens" type="range" min="1" max="10" value="5" style="width:100%">
   Vzdálenost světa <input id="distance" type="range" min="1" max="3" value="2" style="width:100%">
   <label><input id="shadows" type="checkbox" checked> Stíny</label>
  </div>
  <div style="color:#8394a5;font-size:11px;margin-top:18px">SirTros Games</div>
 </div>
</div>

<div id="worldSelect">
 <div class="worldHead">
  <button id="worldBack"><i data-lucide="arrow-left"></i></button>
  <h1>Moje světy</h1>
  <button class="newWorld" id="newWorld"><i data-lucide="plus"></i> Nový svět</button>
 </div>
 <div id="worldGrid"></div>
</div>
<div id="loading">Generuji svět…</div>

<div id="game">
 <div id="hud">
  <div id="top">
   <button class="hudBtn" id="back" title="Menu"><i data-lucide="menu"></i></button>
   <button class="hudBtn" id="invBtn"><i data-lucide="backpack"></i> Inventář</button>
  </div>
  <div id="coords">X: 0 · Z: 0</div>
  <div id="crosshair">+</div>
  <div id="progress"><div></div></div>
  <div id="hearts" aria-label="Životy"></div>
  <div id="hotbar"></div>

  <div id="inventory">
   <div class="invTitle">
    <span><i data-lucide="backpack"></i> Inventář</span>
    <button id="closeInv" class="hudBtn" title="Zavřít"><i data-lucide="x"></i></button>
   </div>
   <div class="section">Inventář</div>
   <div class="grid" id="invGrid"></div>
   <div class="section">Rychlý panel</div>
   <div id="invHotbar"></div>
   <div class="section">Výroba předmětů</div>
   <div id="craftList"></div>
  </div>

  <div id="mobile">
   <div id="joy"><div id="stick"></div></div>
   <button id="jump" title="Skok"><i data-lucide="arrow-up"></i></button>
  </div>
 </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const PLAYER_HEIGHT=1.8,EYE_HEIGHT=1.62;
const TYPES={
 grass:{name:'Tráva',color:0x65a94e},
 dirt:{name:'Hlína',color:0x805332},
 stone:{name:'Kámen',color:0x888e96},
 wood:{name:'Dřevo',color:0x986638},
 leaves:{name:'Listí',color:0x368a42},
 sand:{name:'Písek',color:0xd9c47c},
 planks:{name:'Prkna',color:0xb88850},
 brick:{name:'Cihly',color:0x9c5145},
 cobble:{name:'Dlážděný kámen',color:0x686e75},
 stone_bricks:{name:'Kamenné cihly',color:0x92999e},
 glass:{name:'Sklo',color:0xb7e8ed},
 clay:{name:'Jíl',color:0xa86c60},
 sticks:{name:'Tyčky',color:0xb98b55},
 crafting_table:{name:'Pracovní stůl',color:0x9b673d},
 gold:{name:'Zlatý blok',color:0xe6c34b}
};
const SIZE=5000,CHUNK=16;
let worldSeed=83421,activeWorldId=null;
let scene,camera,renderer,clock,raycaster;
let running=false,raf=0,inventoryOpen=false;
let player={x:2500,y:25,z:2500,vx:0,vy:0,vz:0,onGround:false,yaw:0,pitch:0};
let keys={},chunks=new Map(),edits=new Map();
let inventory=Array(36).fill(null),selected=0;
let mining=null,moveTouch=null,lastCX=99999,lastCZ=99999;
let activeTouches=new Map(),touchMineTime=0;
const textureCanvases={},materials={};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const blockKey=(x,y,z)=>`${x},${y},${z}`;
const chunkKey=(x,z)=>`${x},${z}`;

function requestGameFullscreen(){
 const el=document.documentElement;
 if(!document.fullscreenElement&&el.requestFullscreen){
  el.requestFullscreen().catch(()=>{});
 }
}
function hash(x,z){
 let n=Math.sin(x*127.1+z*311.7+worldSeed)*43758.5453;
 return n-Math.floor(n);
}
function heightAt(x,z){
 return Math.floor(8+Math.sin(x*.018)*2.2+Math.cos(z*.021)*2.1+Math.sin((x+z)*.008)*2.5+Math.sin(x*.044+z*.025)*.7);
}
function treeAt(x,z){return hash(x,z)>.986&&heightAt(x,z)>6}
function naturalBlock(x,y,z){
 if(x<0||z<0||x>=SIZE||z>=SIZE||y<0)return null;
 const h=heightAt(x,z);
 if(y>h)return null;
 if(y===h)return h<=6?'sand':'grass';
 if(y>=h-3)return 'dirt';
 return 'stone';
}
function treeBlock(x,y,z){
 for(let tx=x-2;tx<=x+2;tx++)for(let tz=z-2;tz<=z+2;tz++){
  if(!treeAt(tx,tz))continue;
  const h=heightAt(tx,tz),trunk=h+1,top=trunk+4;
  if(x===tx&&z===tz&&y>=trunk&&y<=top)return 'wood';
  const dx=Math.abs(x-tx),dz=Math.abs(z-tz);
  if(y>=top-1&&y<=top+2&&dx<=2&&dz<=2&&dx+dz<4){
   if(!(dx===0&&dz===0&&y<=top))return 'leaves';
  }
 }
 return null;
}
function blockAt(x,y,z){
 const k=blockKey(x,y,z);
 if(edits.has(k))return edits.get(k);
 return treeBlock(x,y,z)||naturalBlock(x,y,z);
}

/* TEXTURY */
function makeTexture(type){
 const c=document.createElement('canvas');c.width=c.height=128;
 const ctx=c.getContext('2d');
 let seed=type.split('').reduce((a,b)=>a+b.charCodeAt(0),83421);
 function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
 const base='#'+TYPES[type].color.toString(16).padStart(6,'0');
 ctx.fillStyle=base;ctx.fillRect(0,0,128,128);

 if(type==='grass'){
  ctx.fillStyle='#6eaa4b';ctx.fillRect(0,0,128,128);
  for(let i=0;i<700;i++){
   ctx.fillStyle=rand()>.5?'#8bc65b':'#477e39';
   ctx.fillRect(rand()*128,rand()*128,1+rand()*3,1+rand()*4);
  }
 }else if(type==='dirt'||type==='clay'){
  for(let i=0;i<1100;i++){
   ctx.fillStyle=rand()>.7?'#a4774b':rand()>.4?'#69442d':'#936340';
   ctx.globalAlpha=.35+rand()*.5;
   ctx.fillRect(rand()*128,rand()*128,1+rand()*3,1+rand()*3);
  }
 }else if(type==='stone'||type==='cobble'||type==='stone_bricks'){
  for(let y=0;y<128;y+=type==='stone_bricks'?32:16){
   for(let x=0;x<128;x+=type==='stone_bricks'?64:32){
    const off=(y/(type==='stone_bricks'?32:16))%2?16:0;
    ctx.fillStyle=type==='cobble'?'#747b82':type==='stone_bricks'?'#999fa4':'#858c92';
    ctx.fillRect(x+off,y,30,14);
    ctx.fillStyle='#5e656c';ctx.fillRect(x+off,y+14,30,2);
   }
  }
  for(let i=0;i<200;i++){
   ctx.fillStyle=rand()>.5?'#b2b7bb':'#555d64';
   ctx.globalAlpha=.2;ctx.fillRect(rand()*128,rand()*128,2+rand()*7,2+rand()*5);
  }
 }else if(type==='wood'||type==='sticks'){
  for(let i=0;i<45;i++){
   ctx.strokeStyle=rand()>.5?'#c08a4d':'#684322';
   ctx.globalAlpha=.35+rand()*.4;ctx.lineWidth=1+rand()*3;
   const x=rand()*128;
   ctx.beginPath();ctx.moveTo(x,0);ctx.bezierCurveTo(x+8,40,x-8,80,x+rand()*8,128);ctx.stroke();
  }
 }else if(type==='leaves'){
  for(let i=0;i<600;i++){
   ctx.fillStyle=['#55a94b','#70bd57','#286b32','#9acb5e'][Math.floor(rand()*4)];
   const x=Math.floor(rand()*32)*4,y=Math.floor(rand()*32)*4;
   ctx.fillRect(x,y,4,4);
  }
 }else if(type==='sand'){
  for(let i=0;i<1500;i++){
   ctx.fillStyle=rand()>.5?'#f0dda0':'#bba566';
   ctx.globalAlpha=.3+rand()*.4;ctx.fillRect(rand()*128,rand()*128,1+rand()*2,1+rand()*2);
  }
 }else if(type==='planks'||type==='crafting_table'){
  for(let y=0;y<128;y+=32){
   ctx.globalAlpha=1;ctx.fillStyle='#6c482c';ctx.fillRect(0,y,128,2);
   for(let x=0;x<128;x+=64){
    ctx.strokeStyle='#d3a16b';ctx.strokeRect(x+2,y+3,60,26);
   }
  }
  if(type==='crafting_table'){
   ctx.fillStyle='#49301e';ctx.fillRect(0,0,128,13);
   ctx.strokeStyle='#e0b06e';ctx.lineWidth=3;
   for(let i=0;i<4;i++){ctx.strokeRect(12+i*28,28,20,20)}
  }
 }else if(type==='brick'){
  for(let y=0;y<128;y+=32){
   ctx.fillStyle='#d0b7a1';ctx.fillRect(0,y,128,3);
   const offset=(y/32)%2?32:0;
   for(let x=-32+offset;x<128;x+=64){
    ctx.fillRect(x,y,3,32);
    ctx.fillStyle='#bd6b59';ctx.fillRect(x+4,y+4,55,24);
    ctx.fillStyle='#d0b7a1';
   }
  }
 }else if(type==='glass'){
  ctx.clearRect(0,0,128,128);
  ctx.fillStyle='#b7e8ed';ctx.globalAlpha=.25;ctx.fillRect(0,0,128,128);
  ctx.globalAlpha=.8;ctx.strokeStyle='#eaffff';ctx.lineWidth=5;
  ctx.strokeRect(3,3,122,122);
  ctx.beginPath();ctx.moveTo(10,105);ctx.lineTo(105,10);ctx.stroke();
 }else if(type==='gold'){
  ctx.fillStyle='#e8c64d';ctx.fillRect(0,0,128,128);
  for(let i=0;i<180;i++){
   ctx.fillStyle=rand()>.5?'#ffed8a':'#b68b24';
   ctx.fillRect(rand()*128,rand()*128,2+rand()*8,2+rand()*8);
  }
 }
 ctx.globalAlpha=1;
 const tex=new THREE.CanvasTexture(c);
 tex.magFilter=THREE.NearestFilter;
 tex.minFilter=THREE.NearestMipmapLinearFilter;
 tex.colorSpace=THREE.SRGBColorSpace;
 textureCanvases[type]=c;
 return tex;
}
function setupMaterials(){
 for(const type of Object.keys(TYPES)){
  materials[type]=new THREE.MeshLambertMaterial({
   map:makeTexture(type),
   transparent:type==='glass',
   opacity:type==='glass'?.48:1
  });
 }
}
function textureStyle(type){
 if(!type||!textureCanvases[type])return {};
 return {backgroundImage:`url(${textureCanvases[type].toDataURL()})`};
}

/* INVENTÁŘ */
function addItem(type,count=1){
 for(let i=0;i<inventory.length&&count>0;i++){
  const s=inventory[i];
  if(s&&s.type===type&&s.count<64){
   const n=Math.min(64-s.count,count);s.count+=n;count-=n;
  }
 }
 for(let i=0;i<inventory.length&&count>0;i++){
  if(!inventory[i]){
   const n=Math.min(64,count);inventory[i]={type,count:n};count-=n;
  }
 }
 renderInventory();
}
function removeItem(type,count=1){
 for(let i=0;i<inventory.length&&count>0;i++){
  const s=inventory[i];
  if(s&&s.type===type){
   const n=Math.min(s.count,count);s.count-=n;count-=n;
   if(s.count<=0)inventory[i]=null;
  }
 }
 renderInventory();return count===0;
}
function countItem(type){return inventory.reduce((n,s)=>n+(s&&s.type===type?s.count:0),0)}
function renderHearts(){
 const box=$('hearts');box.innerHTML='';
 for(let i=0;i<10;i++){
  const icon=document.createElement('i');
  icon.setAttribute('data-lucide','heart');
  box.appendChild(icon);
 }
 if(window.lucide)lucide.createIcons();
}
function renderHotbar(){
 $('hotbar').innerHTML='';
 for(let i=0;i<9;i++){
  const s=inventory[i],el=document.createElement('div');
  el.className='slot'+(selected===i?' selected':'');
  if(s)Object.assign(el.style,textureStyle(s.type));
  if(s)el.innerHTML=`<span class="count">${s.count}</span>`;
  el.innerHTML+=`<span class="num">${i+1}</span>`;
  el.onclick=()=>{selected=i;renderHotbar()};
  $('hotbar').appendChild(el);
 }
}
function makeInventorySlot(index){
 const s=inventory[index],el=document.createElement('div');
 el.className='invslot';
 if(s)Object.assign(el.style,textureStyle(s.type));
 if(s)el.innerHTML=`<span class="count">${s.count}</span>`;
 el.draggable=!!s;
 el.ondragstart=e=>e.dataTransfer.setData('text/plain',String(index));
 el.ondragover=e=>{e.preventDefault();el.classList.add('dragover')};
 el.ondragleave=()=>el.classList.remove('dragover');
 el.ondrop=e=>{
  e.preventDefault();el.classList.remove('dragover');
  const from=Number(e.dataTransfer.getData('text/plain'));
  if(!Number.isInteger(from)||from<0||from>=36||from===index)return;
  const temp=inventory[index];inventory[index]=inventory[from];inventory[from]=temp;
  renderInventory();saveGame();
 };
 el.onclick=()=>{
  if(s&&index<9){selected=index;renderHotbar()}
 };
 return el;
}
function renderInventory(){
 const grid=$('invGrid'),bar=$('invHotbar');
 grid.innerHTML='';bar.innerHTML='';
 for(let i=9;i<36;i++)grid.appendChild(makeInventorySlot(i));
 for(let i=0;i<9;i++)bar.appendChild(makeInventorySlot(i));
 renderHotbar();renderCrafting();
}
const recipes=[
 {out:'planks',n:4,need:{wood:1},name:'Prkna ×4'},
 {out:'sticks',n:4,need:{planks:2},name:'Tyčky ×4'},
 {out:'crafting_table',n:1,need:{planks:4},name:'Pracovní stůl'},
 {out:'brick',n:2,need:{stone:4},name:'Cihly ×2'},
 {out:'cobble',n:4,need:{stone:2},name:'Dlážděný kámen ×4'},
 {out:'stone_bricks',n:4,need:{cobble:4},name:'Kamenné cihly ×4'},
 {out:'glass',n:2,need:{sand:4},name:'Sklo ×2'},
 {out:'clay',n:2,need:{dirt:3},name:'Jíl ×2'},
 {out:'gold',n:1,need:{stone:6,brick:2},name:'Zlatý blok'},
 {out:'planks',n:8,need:{wood:2,sticks:2},name:'Prkna ×8'}
];
function renderCrafting(){
 const box=$('craftList');box.innerHTML='';
 recipes.forEach(r=>{
  const b=document.createElement('button');b.className='recipe';
  b.disabled=!Object.entries(r.need).every(([t,n])=>countItem(t)>=n);
  b.textContent=r.name+' · '+Object.entries(r.need).map(([t,n])=>n+' '+TYPES[t].name).join(', ');
  b.onclick=()=>{
   if(!Object.entries(r.need).every(([t,n])=>countItem(t)>=n))return;
   for(const [t,n] of Object.entries(r.need))removeItem(t,n);
   addItem(r.out,r.n);saveGame();
  };
  box.appendChild(b);
 });
}

/* CHUNKY */
const cubeGeo=new THREE.BoxGeometry(1,1,1);
function createChunk(cx,cz){
 const k=chunkKey(cx,cz);if(chunks.has(k))return;
 const groups={};for(const t of Object.keys(TYPES))groups[t]=[];
 for(let x=cx*CHUNK;x<(cx+1)*CHUNK;x++){
  for(let z=cz*CHUNK;z<(cz+1)*CHUNK;z++){
   if(x<0||z<0||x>=SIZE||z>=SIZE)continue;
   const h=heightAt(x,z);
   for(let y=Math.max(0,h-9);y<=h;y++){
    const t=blockAt(x,y,z);if(t&&groups[t])groups[t].push([x,y,z]);
   }
   if(treeAt(x,z)){
    for(let y=h+1;y<=h+5;y++){
     const t=blockAt(x,y,z);if(t&&groups[t])groups[t].push([x,y,z]);
    }
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=6;dy++){
     if(Math.abs(dx)+Math.abs(dz)>3)continue;
     const t=blockAt(x+dx,h+dy,z+dz);
     if(t&&groups[t])groups[t].push([x+dx,h+dy,z+dz]);
    }
   }
  }
 }
 for(const [str,val] of edits){
  const [x,y,z]=str.split(',').map(Number);
  if(Math.floor(x/CHUNK)!==cx||Math.floor(z/CHUNK)!==cz)continue;
  for(const arr of Object.values(groups)){
   const i=arr.findIndex(p=>p[0]===x&&p[1]===y&&p[2]===z);
   if(i!==-1)arr.splice(i,1);
  }
  if(val&&groups[val])groups[val].push([x,y,z]);
 }
 const group=new THREE.Group();
 for(const [type,positions] of Object.entries(groups)){
  if(!positions.length)continue;
  const mesh=new THREE.InstancedMesh(cubeGeo,materials[type],positions.length);
  const dummy=new THREE.Object3D();
  positions.forEach((p,i)=>{
   dummy.position.set(p[0]+.5,p[1]+.5,p[2]+.5);
   dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
  });
  mesh.instanceMatrix.needsUpdate=true;
  mesh.userData={type,positions};group.add(mesh);
 }
 scene.add(group);chunks.set(k,group);
}
function removeChunk(k){
 const g=chunks.get(k);if(!g)return;
 scene.remove(g);chunks.delete(k);
}
function rebuildChunk(cx,cz){
 const k=chunkKey(cx,cz);removeChunk(k);createChunk(cx,cz);
}
function updateChunks(force=false){
 const cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK);
 if(!force&&cx===lastCX&&cz===lastCZ)return;
 lastCX=cx;lastCZ=cz;
 const r=Number($('distance').value)||2,wanted=new Set();
 for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++){
  const xx=cx+x,zz=cz+z;
  if(xx<0||zz<0||xx*CHUNK>=SIZE||zz*CHUNK>=SIZE)continue;
  const k=chunkKey(xx,zz);wanted.add(k);createChunk(xx,zz);
 }
 for(const k of [...chunks.keys()])if(!wanted.has(k))removeChunk(k);
}
function setBlock(x,y,z,type){
 if(y<0||y>100)return;
 edits.set(blockKey(x,y,z),type);
 rebuildChunk(Math.floor(x/CHUNK),Math.floor(z/CHUNK));saveGame();
}

/* POHYB */
function groundHeight(x,z){
 return heightAt(Math.floor(x),Math.floor(z))+1;
}
function collidesAt(x,feet,z){
 for(let bx=Math.floor(x-.3);bx<=Math.floor(x+.3);bx++)
 for(let bz=Math.floor(z-.3);bz<=Math.floor(z+.3);bz++)
 for(let by=Math.floor(feet+.08);by<=Math.floor(feet+PLAYER_HEIGHT-.001);by++)
 if(blockAt(bx,by,bz))return true;
 return false;
}
function spawn(){
 player.x=2500;player.z=2500;player.y=groundHeight(player.x,player.z);
 player.vx=player.vy=player.vz=0;player.yaw=0;player.pitch=0;updateCamera();
}
function updateCamera(){
 camera.position.set(player.x,player.y+EYE_HEIGHT,player.z);
 camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
}
function updatePlayer(dt){
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0);
 const s=(keys.KeyD?1:0)-(keys.KeyA?1:0),len=Math.hypot(f,s)||1;
 const speed=5.2,fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw);
 const rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
 const tx=(fx*f+rx*s)/len*speed,tz=(fz*f+rz*s)/len*speed;
 const smooth=Math.min(1,dt*12);
 player.vx+=(tx-player.vx)*smooth;player.vz+=(tz-player.vz)*smooth;
 const nx=player.x+player.vx*dt,nz=player.z+player.vz*dt;
 if(!collidesAt(nx,player.y,player.z))player.x=clamp(nx,1,SIZE-1);else player.vx=0;
 if(!collidesAt(player.x,player.y,nz))player.z=clamp(nz,1,SIZE-1);else player.vz=0;
 player.vy-=22*dt;
 let ny=player.y+player.vy*dt;
 const ground=groundHeight(player.x,player.z);
 if(player.vy<=0&&ny<=ground){ny=ground;player.vy=0;player.onGround=true}
 else player.onGround=false;
 if(player.vy>0&&collidesAt(player.x,ny,player.z)){player.vy=0;ny=player.y}
 player.y=ny;updateCamera();
}

/* TĚŽENÍ A STAVĚNÍ */
function getTarget(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const list=[];for(const g of chunks.values())g.children.forEach(m=>list.push(m));
 const hits=raycaster.intersectObjects(list,false);
 if(!hits.length||hits[0].distance>6)return null;
 const h=hits[0],p=h.object.userData.positions[h.instanceId];
 if(!p)return null;
 return {x:p[0],y:p[1],z:p[2],type:h.object.userData.type,normal:h.face.normal.clone()};
}
function hideProgress(){$('progress').style.display='none';$('progress').firstElementChild.style.width='0%'}
function mineBlock(){
 const t=getTarget();if(!t||t.y<=0)return;
 const type=blockAt(t.x,t.y,t.z);if(!type)return;
 setBlock(t.x,t.y,t.z,null);addItem(type,1);
 mining=null;hideProgress();
}
function startMine(){
 if(!running||inventoryOpen)return;
 const t=getTarget();if(!t)return;
 mining={start:performance.now()};
 $('progress').style.display='block';
}
function stopMine(){
 if(!mining)return;
 if(performance.now()-mining.start>100)mineBlock();
 mining=null;hideProgress();
}
function placeBlock(){
 if(!running||inventoryOpen)return;
 const s=inventory[selected];if(!s)return;
 const t=getTarget();if(!t)return;
 const nx=Math.round(t.x+t.normal.x),ny=Math.round(t.y+t.normal.y),nz=Math.round(t.z+t.normal.z);
 if(ny<0||ny>80||blockAt(nx,ny,nz))return;
 if(nx>=player.x-.8&&nx<=player.x+.8&&nz>=player.z-.8&&nz<=player.z+.8&&ny>=player.y&&ny<=player.y+PLAYER_HEIGHT)return;
 setBlock(nx,ny,nz,s.type);s.count--;if(s.count<=0)inventory[selected]=null;
 renderInventory();
}

/* UKLÁDÁNÍ SVĚTŮ */
const WORLDS_KEY='sirtros_block_worlds_v2';
let worlds=[];
function saveWorldList(){
 try{localStorage.setItem(WORLDS_KEY,JSON.stringify(worlds))}catch(e){console.warn('Svět se nepodařilo uložit',e)}
}
function saveGame(){
 if(!activeWorldId)return;
 const w=worlds.find(x=>x.id===activeWorldId);if(!w)return;
 w.edits=[...edits.entries()];w.inventory=inventory;
 w.player={x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch};
 w.updated=Date.now();saveWorldList();
}
function loadWorldList(){
 try{worlds=JSON.parse(localStorage.getItem(WORLDS_KEY)||'[]');if(!Array.isArray(worlds))worlds=[]}catch(e){worlds=[]}
}
function nextWorldName(){
 const used=worlds.map(w=>Number((String(w.name).match(/\d+/)||[])[0])).filter(Number.isFinite);
 let n=1;while(used.includes(n))n++;return 'Svět '+n;
}
function createWorld(){
 const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
 worlds.push({id,name:nextWorldName(),seed:Math.floor(Math.random()*999999999),created:Date.now(),edits:[],inventory:Array(36).fill(null),player:null});
 saveWorldList();renderWorldList();
}
function drawWorldPreview(canvas,seed){
 const c=canvas.getContext('2d'),w=canvas.width=520,h=canvas.height=260;
 const sky=c.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,'#6caedb');sky.addColorStop(1,'#d5e9f2');
 c.fillStyle=sky;c.fillRect(0,0,w,h);
 c.fillStyle='#4c8042';c.beginPath();c.moveTo(0,165);
 for(let x=0;x<=w;x+=8)c.lineTo(x,150+Math.sin(x*.018+seed*.001)*18+Math.sin(x*.047+seed*.002)*9);
 c.lineTo(w,h);c.lineTo(0,h);c.fill();
 for(let i=0;i<6;i++){
  const x=35+hash(i+seed%91,4)*450,y=125+hash(i,seed%73)*45;
  c.fillStyle='#805332';c.fillRect(x,y,12,34);
  c.fillStyle='#397b3d';c.fillRect(x-12,y-24,36,30);
 }
}
function renderWorldList(){
 const grid=$('worldGrid');grid.innerHTML='';
 if(!worlds.length){
  grid.innerHTML='<div class="worldEmpty">Zatím nemáš žádný svět.<br>Vytvoř si svůj první svět!</div>';return;
 }
 worlds.forEach(w=>{
  const card=document.createElement('article');card.className='worldCard';
  const preview=document.createElement('canvas');preview.className='worldPreview';drawWorldPreview(preview,w.seed||83421);
  const info=document.createElement('div');info.className='worldCardInfo';
  const name=document.createElement('div');name.className='worldCardName';name.textContent=w.name;
  const date=document.createElement('div');date.className='worldCardDate';
  date.textContent='Vytvořeno '+new Date(w.created||Date.now()).toLocaleDateString('cs-CZ');
  const actions=document.createElement('div');actions.className='worldCardActions';
  const play=document.createElement('button');play.className='worldStart';play.textContent='Hrát';
  play.onclick=()=>{requestGameFullscreen();startGame(w.id)};
  const del=document.createElement('button');del.className='worldDelete';
  del.innerHTML='<i data-lucide="trash-2"></i>';del.title='Smazat svět';
  del.onclick=()=>{
   if(confirm('Opravdu smazat '+w.name+'?')){
    worlds=worlds.filter(x=>x.id!==w.id);saveWorldList();renderWorldList();
   }
  };
  actions.append(play,del);info.append(name,date,actions);card.append(preview,info);grid.append(card);
 });
 if(window.lucide)lucide.createIcons();
}
function loadWorldData(w){
 activeWorldId=w.id;worldSeed=w.seed||83421;
 edits=new Map(Array.isArray(w.edits)?w.edits:[]);
 inventory=Array.isArray(w.inventory)?w.inventory:Array(36).fill(null);
 if(inventory.length!==36)inventory=Array.from({length:36},(_,i)=>inventory[i]||null);
 selected=0;
 if(w.player){
  player.x=clamp(Number(w.player.x)||2500,1,SIZE-1);
  player.z=clamp(Number(w.player.z)||2500,1,SIZE-1);
  player.y=Math.max(groundHeight(player.x,player.z),Number(w.player.y)||10);
  player.yaw=Number(w.player.yaw)||0;player.pitch=Number(w.player.pitch)||0;
 }else{
  player.x=2500;player.z=2500;player.y=groundHeight(player.x,player.z);
  player.yaw=0;player.pitch=0;
 }
 player.vx=player.vy=player.vz=0;player.onGround=false;
}

/* OVLÁDÁNÍ */
function isMobile(){return matchMedia('(pointer:coarse)').matches||innerWidth<700}
function toggleInventory(){
 inventoryOpen=!inventoryOpen;
 $('inventory').style.display=inventoryOpen?'block':'none';
 if(inventoryOpen){document.exitPointerLock?.();renderInventory()}
 else if(!isMobile())renderer.domElement.requestPointerLock?.();
}
function pauseGame(){
 if(!running)return;
 running=false;saveGame();document.exitPointerLock?.();
 $('game').style.display='none';$('menu').style.display='flex';
}
function setupControls(){
 document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){
   if(inventoryOpen)toggleInventory();else pauseGame();return;
  }
  if(e.code==='KeyE'){toggleInventory();return}
  if(e.code.startsWith('Digit')){
   const n=Number(e.code.slice(5))-1;
   if(n>=0&&n<9){selected=n;renderHotbar()}
  }
  keys[e.code]=true;
 });
 document.addEventListener('keyup',e=>keys[e.code]=false);
 renderer.domElement.addEventListener('click',()=>{
  if(!isMobile()&&!inventoryOpen&&running&&!document.pointerLockElement)
   renderer.domElement.requestPointerLock?.();
 });
 document.addEventListener('mousemove',e=>{
  if(!document.pointerLockElement||!running||inventoryOpen)return;
  const sens=Number($('sens').value)*.00045;
  player.yaw-=e.movementX*sens;
  player.pitch=clamp(player.pitch-e.movementY*sens,-1.5,1.5);
  updateCamera();
 });
 renderer.domElement.addEventListener('mousedown',e=>{
  if(!running||inventoryOpen)return;
  if(e.button===0)startMine();
  if(e.button===2)placeBlock();
 });
 document.addEventListener('mouseup',e=>{if(e.button===0)stopMine()});
 renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
 window.addEventListener('wheel',e=>{
  if(!running||inventoryOpen)return;
  selected=(selected+(e.deltaY>0?1:8))%9;renderHotbar();
 },{passive:true});
 $('invBtn').onclick=toggleInventory;
 $('closeInv').onclick=toggleInventory;
 $('back').onclick=pauseGame;
 $('jump').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(player.onGround){player.vy=8;player.onGround=false}
 });
 const joy=$('joy'),stick=$('stick');
 joy.addEventListener('pointerdown',e=>{
  e.preventDefault();moveTouch=e.pointerId;
  joy.setPointerCapture(e.pointerId);moveJoystick(e);
 });
 joy.addEventListener('pointermove',e=>{
  if(e.pointerId===moveTouch)moveJoystick(e);
 });
 function releaseJoy(e){
  if(e.pointerId!==moveTouch)return;
  moveTouch=null;keys.KeyW=keys.KeyA=keys.KeyS=keys.KeyD=false;
  stick.style.left='33px';stick.style.top='33px';
 }
 joy.addEventListener('pointerup',releaseJoy);
 joy.addEventListener('pointercancel',releaseJoy);
 function moveJoystick(e){
  const r=joy.getBoundingClientRect();
  let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
  const d=Math.hypot(dx,dy),max=34;
  if(d>max){dx=dx/d*max;dy=dy/d*max}
  stick.style.left=33+dx+'px';stick.style.top=33+dy+'px';
  keys.KeyW=dy<-9;keys.KeyS=dy>9;keys.KeyA=dx<-9;keys.KeyD=dx>9;
 }
 renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'||inventoryOpen)return;
  activeTouches.set(e.pointerId,true);
  if(activeTouches.size===1){touchMineTime=performance.now();startMine()}
  else if(activeTouches.size>=2){mining=null;hideProgress();placeBlock()}
 });
 renderer.domElement.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch')return;
  const one=activeTouches.size===1;activeTouches.delete(e.pointerId);
  if(one&&performance.now()-touchMineTime<300)mineBlock();
  mining=null;hideProgress();
 });
 renderer.domElement.addEventListener('pointercancel',e=>{
  activeTouches.delete(e.pointerId);mining=null;hideProgress();
 });
}

/* SPUŠTĚNÍ */
function initThree(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87b9df);
 scene.fog=new THREE.Fog(0x87b9df,35,105);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,180);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=$('shadows').checked;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $('game').insertBefore(renderer.domElement,$('hud'));

 scene.add(new THREE.HemisphereLight(0xd9edff,0x566044,.85));
 const sun=new THREE.DirectionalLight(0xfff0d5,1.05);
 sun.position.set(80,120,40);
 sun.castShadow=$('shadows').checked;
 sun.shadow.mapSize.set(512,512);
 sun.shadow.radius=5;
 sun.shadow.bias=-.0003;
 scene.add(sun);

 clock=new THREE.Clock();raycaster=new THREE.Raycaster();raycaster.far=6;
 setupMaterials();setupControls();
 window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
 });
}
function animate(){
 if(!renderer)return;
 raf=requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(running&&!inventoryOpen){
  updatePlayer(dt);updateChunks();
  $('coords').textContent=`X: ${Math.floor(player.x)} · Z: ${Math.floor(player.z)}`;
  if(mining){
   const pct=clamp((performance.now()-mining.start)/650*100,0,100);
   $('progress').firstElementChild.style.width=pct+'%';
   if(pct>=100)mineBlock();
  }
 }
 renderer.render(scene,camera);
}
function startGame(worldId){
 const selectedWorld=worlds.find(w=>w.id===worldId);
 if(!selectedWorld)return;
 $('worldSelect').style.display='none';
 $('menu').style.display='none';
 $('loading').style.display='flex';
 loadWorldData(selectedWorld);
 setTimeout(()=>{
  try{
   if(!renderer)initThree();
   for(const k of [...chunks.keys()])removeChunk(k);
   chunks.clear();lastCX=lastCZ=99999;
   updateCamera();
   $('game').style.display='block';
   running=true;inventoryOpen=false;$('inventory').style.display='none';
   updateChunks(true);renderInventory();renderHearts();
   if(!raf)animate();
   $('loading').style.display='none';
  }catch(e){
   console.error(e);
   $('loading').textContent='Chyba: '+e.message;
  }
 },250);
}
$('play').onclick=()=>{
 requestGameFullscreen();
 renderWorldList();
 $('menu').style.display='none';
 $('worldSelect').style.display='flex';
 if(window.lucide)lucide.createIcons();
};
$('worldBack').onclick=()=>{
 $('worldSelect').style.display='none';
 $('menu').style.display='flex';
};
$('newWorld').onclick=createWorld;
$('settingsBtn').onclick=()=>{
 $('settings').style.display=$('settings').style.display==='block'?'none':'block';
};
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&running)saveGame();
});
window.addEventListener('beforeunload',saveGame);
loadWorldList();
if(window.lucide)lucide.createIcons();
renderHotbar();renderHearts();
})();
</script>
